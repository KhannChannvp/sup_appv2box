<!DOCTYPE html>
<html lang="km" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Subscription - VPN Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap">
  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between">
  
  <div class="max-w-md mx-auto px-4 py-8 w-full flex-grow space-y-6">
    <div class="space-y-1">
      <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Subscription Portal</p>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Import Sub</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Link Subscription សម្រាប់ Import ចូលកម្មវិធី តាមប្រតិបត្តិនីមួយៗ</p>
    </div>

    <!-- Carrier Selector -->
    <div class="bg-white dark:bg-slate-900 p-2 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex justify-center">
      <span class="text-sm font-bold text-slate-700 dark:text-slate-200">Metfone / V2Box / Happ</span>
    </div>

    <!-- Action Buttons -->
    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-4">
      <h2 class="text-base font-bold text-slate-800 dark:text-white">ទាញយក Subscription</h2>
      
      <div class="grid grid-cols-2 gap-3">
        <button onclick="importHapp()" class="w-full py-3 px-4 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-xl font-medium text-sm flex items-center justify-center gap-2 shadow-sm">
          Happ
        </button>
        <button onclick="importV2Box()" class="w-full py-3 px-4 bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-medium text-sm flex items-center justify-center gap-2">
          V2Box
        </button>
      </div>
    </div>
  </div>

  <script>
    // -- Link Gist Raw និង Function Import សម្រាប់ Happ និង V2Box --
    const subUrl = "https://gist.githubusercontent.com/KhannChannvp/066d45795b51ba2439d5ecdf01a784fa/raw/e2cdb01d3a9af5797927b51ad010c6e8b39270a8/gistfile1.txt";

    function importHapp() {
      window.location.href = "happ://add/" + encodeURIComponent(subUrl);
    }

    function importV2Box() {
      window.location.href = "v2box://install-sub?url=" + encodeURIComponent(subUrl);
    }
  </script>
</body>
</html>
